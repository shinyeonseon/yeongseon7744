# Watchlist of symbols to screen. Copy to config/universe.yaml and edit.
# Entries may be a bare symbol string or a {symbol, name, sector} mapping.
# Only symbols for the active MARKET setting (KRX / US / BOTH) are loaded.
#
# `sector` is optional but recommended: it powers the diversification cap
# (MAX_PER_SECTOR — at most N held names per sector), which limits the
# correlated sector-cluster drawdown the backtest exposed. Symbols without a
# sector are never capped. Keep labels consistent (same string = same bucket).
#
# A broader universe gives the screening/strategies real selection power
# (a tiny all-winners list makes every strategy flag everything). ~45 names
# across sectors below. Note: more symbols = more candle calls per run
# (each pages ~2 calls); the chart rate limit (5/s) is handled with backoff.

