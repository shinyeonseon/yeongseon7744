[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tossai"
version = "0.1.0"
description = "Toss Securities investment AI (analysis/recommendation only) — hybrid rule + Claude engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "anthropic>=0.40,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "tenacity>=8.3,<10",
    "typer>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "apscheduler>=3.10,<4",
    "slack_sdk>=3.27,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-mock>=3.14,<4",
    "respx>=0.21,<0.23",
    "freezegun>=1.5,<2",
    "ruff>=0.5,<1",
]
# Fundamental-data sources for the value/quality master strategies. Heavy and a
# bit brittle, so kept optional; lazy-imported and skipped gracefully if absent.
# KRX fundamentals via pykrx, US via yfinance. Install with: pip install -e ".[fundamentals]"
fundamentals = [
    "pykrx>=1.0,<2",
    "yfinance>=0.2,<1",
]

[project.scripts]
tossai = "tossai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line length handled by formatter; UP042: `str, Enum` is intentional
# (clear JSON/pydantic serialization) and preferred over StrEnum here.
ignore = ["E501", "UP042"]
